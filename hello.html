<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello World Game</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    font-family: system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #1b1b2f;
    color: #f2f2f2;
    text-align: center;
    padding: 16px;
    box-sizing: border-box;
  }
  h1 {
    margin-bottom: 4px;
  }
  p.subtitle {
    margin-top: 0;
    color: #a0a0c0;
  }
  #board {
    display: flex;
    gap: 8px;
    margin: 24px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  input#guess {
    font-size: 1.5rem;
    width: 4ch;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    border: 2px solid #555;
  }
  button {
    font-size: 1rem;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #4f6df5;
    color: white;
    cursor: pointer;
    margin: 4px;
  }
  button:hover {
    background: #3a54d6;
  }
  #message {
    min-height: 1.5em;
    font-size: 1.2rem;
    margin-top: 16px;
  }
  #attempts {
    color: #a0a0c0;
  }
</style>
</head>
<body>
  <h1>Hello, World!</h1>
  <p class="subtitle">A tiny number-guessing game — the warm-up before the real one.</p>

  <div id="board">
    <input type="number" id="guess" min="1" max="9" placeholder="?" autofocus>
    <button id="submit">Guess</button>
    <button id="reset">New game</button>
  </div>

  <div id="message">I'm thinking of a number between 1 and 9.</div>
  <div id="attempts"></div>

  <script>
    let secret = pickSecret();
    let tries = 0;

    const guessInput = document.getElementById('guess');
    const message = document.getElementById('message');
    const attempts = document.getElementById('attempts');

    function pickSecret() {
      return Math.floor(Math.random() * 9) + 1;
    }

    function newGame() {
      secret = pickSecret();
      tries = 0;
      guessInput.value = '';
      message.textContent = "I'm thinking of a number between 1 and 9.";
      attempts.textContent = '';
      guessInput.disabled = false;
      guessInput.focus();
    }

    function submitGuess() {
      const value = Number(guessInput.value);
      if (!value || value < 1 || value > 9) {
        message.textContent = 'Enter a number from 1 to 9.';
        return;
      }
      tries++;
      if (value === secret) {
        message.textContent = `🎉 Correct! It was ${secret}.`;
        attempts.textContent = `Solved in ${tries} guess${tries === 1 ? '' : 'es'}.`;
        guessInput.disabled = true;
      } else if (value < secret) {
        message.textContent = 'Higher ⬆️';
      } else {
        message.textContent = 'Lower ⬇️';
      }
    }

    document.getElementById('submit').addEventListener('click', submitGuess);
    document.getElementById('reset').addEventListener('click', newGame);
    guessInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitGuess();
    });
  </script>
</body>
</html>
